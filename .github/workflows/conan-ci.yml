name: Conan CI

# GitHub Actions is disabled for now until the Artifactory service and credentials are ready.
on: []

permissions:
  contents: read

concurrency:
  group: conan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: 2.31.2
  CONAN_READ_REMOTE_NAME: conan-read

jobs:
  verify:
    name: Build and test (${{ matrix.linkage }}, GUI ${{ matrix.gui }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        linkage: [static, shared]
        gui: [False, True]
        include:
          - linkage: static
            shared: False
          - linkage: shared
            shared: True
    env:
      CONAN_READ_REMOTE_URL: ${{ secrets.CONAN_READ_REMOTE_URL }}
      CONAN_READ_USERNAME: ${{ secrets.CONAN_DEV_USERNAME }}
      CONAN_READ_TOKEN: ${{ secrets.CONAN_DEV_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontenc-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libice-dev \
            libsm-dev \
            libx11-dev \
            libxaw7-dev \
            libxcb1-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxft-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxt-dev \
            libxv-dev \
            libxxf86vm-dev

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          home: ${{ github.workspace }}/conanhome
          cache_packages: true
          profile_detect: true

      - name: Configure read-only Artifactory access
        run: |
          test -n "$CONAN_READ_REMOTE_URL"
          test -n "$CONAN_READ_USERNAME"
          test -n "$CONAN_READ_TOKEN"
          conan remote add "$CONAN_READ_REMOTE_NAME" "$CONAN_READ_REMOTE_URL" --force
          conan remote login "$CONAN_READ_REMOTE_NAME" "$CONAN_READ_USERNAME" -p "$CONAN_READ_TOKEN"
          conan config install-pkg conanconfig.yml --lockfile=conan.lock --force -s os=Linux
          conan remote add "$CONAN_READ_REMOTE_NAME" "$CONAN_READ_REMOTE_URL" --force
          conan remote login "$CONAN_READ_REMOTE_NAME" "$CONAN_READ_USERNAME" -p "$CONAN_READ_TOKEN"

      - name: Create detected Conan profile
        run: |
          conan profile detect --force

      - name: Build package and run tests
        run: |
          conan create . \
            --build="dicom_viewer/*" \
            --lockfile=conan.lock \
            -pr:h=default \
            -pr:b=default \
            -s:h build_type=Debug \
            -s:b build_type=Release \
            -s:h compiler.cppstd=23 \
            -s:b compiler.cppstd=23 \
            -o:h=dicom_viewer/*:shared=${{ matrix.shared }} \
            -o:h=dicom_viewer/*:with_gui=${{ matrix.gui }}

  publish:
    name: Publish library packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: conan-publish
    env:
      CONAN_READ_REMOTE_URL: ${{ secrets.CONAN_READ_REMOTE_URL }}
      CONAN_PUBLISH_REMOTE_URL: ${{ secrets.CONAN_PUBLISH_REMOTE_URL }}
      CONAN_CI_USERNAME: ${{ secrets.CONAN_CI_USERNAME }}
      CONAN_CI_TOKEN: ${{ secrets.CONAN_CI_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontenc-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libice-dev \
            libsm-dev \
            libx11-dev \
            libxaw7-dev \
            libxcb1-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxft-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxt-dev \
            libxv-dev \
            libxxf86vm-dev

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          home: ${{ github.workspace }}/conanhome
          cache_packages: true
          profile_detect: true

      - name: Configure Artifactory access
        run: |
          test -n "$CONAN_READ_REMOTE_URL"
          test -n "$CONAN_PUBLISH_REMOTE_URL"
          test -n "$CONAN_CI_USERNAME"
          test -n "$CONAN_CI_TOKEN"
          conan remote add "$CONAN_READ_REMOTE_NAME" "$CONAN_READ_REMOTE_URL" --force
          conan remote login "$CONAN_READ_REMOTE_NAME" "$CONAN_CI_USERNAME" -p "$CONAN_CI_TOKEN"
          conan config install-pkg conanconfig.yml --lockfile=conan.lock --force -s os=Linux
          conan remote add "$CONAN_READ_REMOTE_NAME" "$CONAN_READ_REMOTE_URL" --force
          conan remote login "$CONAN_READ_REMOTE_NAME" "$CONAN_CI_USERNAME" -p "$CONAN_CI_TOKEN"
          conan remote add conan-write "$CONAN_PUBLISH_REMOTE_URL" --force
          conan remote login conan-write "$CONAN_CI_USERNAME" -p "$CONAN_CI_TOKEN"

      - name: Create release package variants
        run: |
          conan profile detect --force
          for shared in False True; do
            for gui in False True; do
              conan create . \
                --build="dicom_viewer/*" \
                --lockfile=conan.lock \
                -pr:h=default \
                -pr:b=default \
                -s:h build_type=Release \
                -s:b build_type=Release \
                -s:h compiler.cppstd=23 \
                -s:b compiler.cppstd=23 \
                -o:h=dicom_viewer/*:shared="$shared" \
                -o:h=dicom_viewer/*:with_gui="$gui" \
                -c:h tools.build:skip_test=True
            done
          done

      - name: Upload library package variants
        run: conan upload "dicom_viewer/0.1.0" -r=conan-write --confirm
